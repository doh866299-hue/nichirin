modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
enumExtensions="META-INF/enumextensions.json"
description='''
Demon Slayer (Kimetsu no Yaiba) Breathing Styles mod for Minecraft 26.3 (NeoForge).
Features separate 3D Water & Sun Nichirin Blades, all 11 canon Water Breathing forms (hold-to-spin Constant Flux with a 3D ukiyo-e Water Dragon), all 13 canon Sun Breathing / Hinokami Kagura forms (Crimson Red Blade, Anti-Heal Scorch, Fake Rainbow afterimage, Dragon Sun Halo blitz & endless Thirteenth Form cycle), Total Concentration Breathing, Opening Thread, and high-refresh-rate combat physics. Zero external dependencies.
Note: Almost entirely built with AI assistance, made purely for fun.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
